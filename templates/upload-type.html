<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Type - Scene-Search</title>
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/sequences.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <a href="/">SCENE SEARCH</a>
        <div class="logo-dropdown">
          <a href="{{ url_for('home') }}" class="dropdown-item">Home</a>
          <a href="{{ url_for('choice') }}" class="dropdown-item">Upload</a>
          <a href="{{ url_for('view_sequences') }}" class="dropdown-item"
            >Sequences</a
          >
          <a href="{{ url_for('view_takes') }}" class="dropdown-item">Takes</a>
        </div>
      </div>
      <div class="header-nav">
        <a href="{{ url_for('search') }}" class="nav-button secondary"
          >Search</a
        >
        <a href="{{ url_for('choice') }}" class="nav-button secondary">Back</a>
      </div>
    </div>

    <div class="container">
      <div class="section">
        <h2 class="section-title">Upload Video</h2>
        <div class="sequences-grid">
          <div class="sequence-card">
            <div class="sequence-header">
              <h3 class="sequence-title">Fresh Clip</h3>
            </div>
            <div class="sequence-description">
              Upload a new scene or clip with title, description, and tags.
            </div>
            <div class="sequence-actions">
              <form
                action="{{ url_for('upload') }}"
                method="get"
                style="width: 100%"
              >
                <button type="submit" class="btn btn-view">Upload Fresh</button>
              </form>
            </div>
          </div>

          <div class="sequence-card">
            <div class="sequence-header">
              <h3 class="sequence-title">Alternative Take</h3>
            </div>
            <div class="sequence-description">
              Upload an alternative take of an existing scene without new
              metadata.
            </div>
            <div class="sequence-actions">
              <form
                action="{{ url_for('upload_take') }}"
                method="get"
                style="width: 100%"
              >
                <button type="submit" class="btn btn-view">Upload Take</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
