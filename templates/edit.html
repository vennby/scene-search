<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit - Scene-Search</title>

    <link rel="icon" type="image/png" href="/static/scene-search.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Roboto:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/css/common.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .edit-wrapper {
        max-width: 1000px;
        margin: 0 auto;
      }

      .edit-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .edit-header h1 {
        font-size: 32px;
        color: #fff;
        margin: 0;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }

      .header-actions {
        display: flex;
        gap: 12px;
      }

      .btn-icon {
        background-color: rgba(255, 107, 107, 0.1);
        color: #ff6b6b;
        border: 1px solid rgba(255, 107, 107, 0.3);
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
      }

      .btn-icon:hover {
        background-color: rgba(255, 107, 107, 0.2);
        border-color: rgba(255, 107, 107, 0.5);
      }

      .edit-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 30px;
      }

      @media (max-width: 900px) {
        .edit-container {
          grid-template-columns: 1fr;
        }
      }

      .preview-section {
        background: linear-gradient(
          135deg,
          rgba(255, 107, 107, 0.05) 0%,
          rgba(255, 107, 107, 0) 100%
        );
        border: 1px solid rgba(255, 107, 107, 0.2);
        border-radius: 12px;
        padding: 24px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .preview-label {
        color: #999;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 16px;
        display: block;
      }

      .preview-media {
        width: 100%;
        border-radius: 8px;
        background-color: #0a0a0a;
        margin-bottom: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .preview-video {
        width: 100%;
        height: 300px;
        object-fit: cover;
      }

      .preview-info {
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        padding: 16px;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 13px;
      }

      .info-label {
        color: #999;
        font-weight: 600;
      }

      .info-value {
        color: #e8e8e8;
        text-align: right;
        max-width: 60%;
        word-break: break-word;
      }

      .form-section {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.02) 0%,
          rgba(255, 255, 255, 0) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 32px;
      }

      .form-group {
        margin-bottom: 28px;
      }

      .form-group:last-child {
        margin-bottom: 0;
      }

      .form-label {
        display: block;
        margin-bottom: 10px;
        color: #e8e8e8;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.3px;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.02);
        color: #e8e8e8;
        font-family: "Roboto", sans-serif;
        font-size: 14px;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }

      .form-input::placeholder,
      .form-textarea::placeholder {
        color: #666;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: none;
        border-color: rgba(255, 107, 107, 0.5);
        background-color: rgba(255, 107, 107, 0.05);
        box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
      }

      .form-textarea {
        resize: vertical;
        min-height: 120px;
        font-family: "Roboto", sans-serif;
      }

      .tags-label {
        display: block;
        margin-bottom: 10px;
        color: #e8e8e8;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.3px;
      }

      .tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.02);
        min-height: 50px;
        align-items: center;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .tags-container:focus-within {
        border-color: rgba(255, 107, 107, 0.5);
        background-color: rgba(255, 107, 107, 0.05);
        box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
      }

      .tag-badge {
        background: linear-gradient(
          135deg,
          rgba(255, 107, 107, 0.8) 0%,
          rgba(255, 107, 107, 0.6) 100%
        );
        color: white;
        padding: 8px 14px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(255, 107, 107, 0.2);
      }

      .tag-remove {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 18px;
        padding: 0;
        line-height: 1;
        opacity: 0.8;
        transition: opacity 0.2s;
      }

      .tag-remove:hover {
        opacity: 1;
      }

      .tag-input {
        background: none;
        border: none;
        color: #e8e8e8;
        font-family: "Roboto", sans-serif;
        font-size: 14px;
        outline: none;
        flex: 1;
        min-width: 150px;
      }

      .tag-input::placeholder {
        color: #666;
      }

      .form-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 40px;
        padding-top: 32px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-primary,
      .btn-secondary {
        padding: 14px 32px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        letter-spacing: 0.5px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background-color: rgba(255, 255, 255, 0.08);
        color: #e8e8e8;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .status-message {
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 24px;
        display: none;
        border-left: 4px solid;
        font-size: 14px;
        font-weight: 500;
      }

      .status-message.success {
        background-color: rgba(76, 175, 80, 0.1);
        color: #4caf50;
        border-left-color: #4caf50;
      }

      .status-message.error {
        background-color: rgba(244, 67, 54, 0.1);
        color: #f44336;
        border-left-color: #f44336;
      }

      .status-message.show {
        display: block;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .document-icon {
        width: 100%;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          rgba(255, 107, 107, 0.1),
          rgba(255, 107, 107, 0)
        );
        border-radius: 8px;
        font-size: 64px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="logo">
        <a href="{{ url_for('search') }}">SCENE SEARCH</a>
        <div class="logo-dropdown">
          <a href="{{ url_for('home') }}" class="dropdown-item">Home</a>
          <a href="{{ url_for('choice') }}" class="dropdown-item">Upload</a>
          <a href="{{ url_for('view_sequences') }}" class="dropdown-item"
            >Sequences</a
          >
          <a href="{{ url_for('view_takes') }}" class="dropdown-item">Takes</a>
        </div>
      </div>
    </div>

    <div class="edit-wrapper">
      <div class="edit-header">
        <h1>Edit {{ 'Video' if item_type == 'video' else 'Document' }}</h1>
        <div class="header-actions">
          <button class="btn-icon" onclick="window.history.back()">
            ← Back
          </button>
        </div>
      </div>

      <div id="statusMessage" class="status-message"></div>

      <div class="edit-container">
        <!-- Preview Section -->
        <div class="preview-section">
          <label class="preview-label">Preview</label>
          {% if item_type == 'video' %}
          <video class="preview-media preview-video" controls>
          <source src="/video/{{ clip.id }}" type="video/mp4" />

          <div class="preview-info">
            <div class="info-row">
              <span class="info-label">Type</span>
              <span class="info-value">Video</span>
            </div>
            <div class="info-row">
              <span class="info-label">Saved</span>
              <span class="info-value"
                >{{ clip.timestamp.strftime('%Y-%m-%d %H:%M') }}</span
              >
            </div>
            {% if clip.video_filename %}
            <div class="info-row">
              <span class="info-label">Path</span>
              <span class="info-value"
                >{{ clip.video_filename }}</span
              >
            </div>
            {% endif %}
          </div>
          {% endif %}
        </div>

        <!-- Form Section -->
        <div class="form-section">
          <form id="editForm">
            <div class="form-group">
              <label class="form-label" for="title">Title *</label>
              <input
                type="text"
                id="title"
                class="form-input"
                value="{{ clip.title }}"
                placeholder="Enter title..."
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="description">Description</label>
              <textarea
                id="description"
                class="form-textarea"
                placeholder="Add a description..."
              >
{{ clip.description or '' }}</textarea
              >
            </div>

            <div class="form-group">
              <label class="tags-label">Tags</label>
              <div class="tags-container" id="tagsContainer">
                {% if clip.tags %} {% for tag in clip.tags.split(',') %}
                <div class="tag-badge">
                  <span>{{ tag.strip() }}</span>
                  <button
                    type="button"
                    class="tag-remove"
                    onclick="removeTag(event)"
                  >
                    ×
                  </button>
                </div>
                {% endfor %} {% endif %}
                <input
                  type="text"
                  class="tag-input"
                  id="tagInput"
                  placeholder="Add tag..."
                  onkeypress="handleTagInput(event)"
                />
              </div>
            </div>

            <div class="form-actions">
              <button
                type="button"
                class="btn-secondary"
                onclick="window.history.back()"
              >
                Cancel
              </button>
              <button type="submit" class="btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const clipId = "{{ clip.id }}";

      function showStatus(message, type) {
        const statusEl = document.getElementById("statusMessage");
        statusEl.textContent = message;
        statusEl.className = `status-message ${type} show`;

        if (type === "success") {
          setTimeout(() => {
            statusEl.classList.remove("show");
          }, 3000);
        }
      }

      function handleTagInput(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          const input = event.target;
          const tag = input.value.trim();

          if (tag) {
            const tagBadge = document.createElement("div");
            tagBadge.className = "tag-badge";
            tagBadge.innerHTML = `
            <span>${tag}</span>
            <button type="button" class="tag-remove" onclick="removeTag(event)">×</button>
          `;

            const container = document.getElementById("tagsContainer");
            container.insertBefore(tagBadge, input);
            input.value = "";
          }
        }
      }

      function removeTag(event) {
        event.preventDefault();
        event.target.closest(".tag-badge").remove();
      }

      document
        .getElementById("editForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const title = document.getElementById("title").value.trim();
          const description = document
            .getElementById("description")
            .value.trim();

          if (!title) {
            showStatus("Title is required", "error");
            return;
          }

          const tagElements = document.querySelectorAll(".tag-badge span");
          const tags = Array.from(tagElements)
            .map((el) => el.textContent.trim())
            .join(", ");

          try {
            const response = await fetch(`/api/edit-clip/${clipId}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                title: title,
                description: description,
                tags: tags,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              showStatus("✓ Changes saved successfully!", "success");
              setTimeout(() => {
                window.location.href = "/search";
              }, 2000);
            } else {
              showStatus(data.error || "Failed to save changes", "error");
            }
          } catch (error) {
            showStatus("An error occurred: " + error.message, "error");
          }
        });
    </script>
  </body>
</html>
